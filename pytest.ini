[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage flags are deliberately NOT here: putting --cov-report in addopts
# makes a bare `pytest` fail with "unrecognized arguments" anywhere pytest-cov
# is not installed. `make test-cov` passes them explicitly instead.
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
